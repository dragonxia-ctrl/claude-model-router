name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline tests
        run: npm test
      - name: CLI safety smoke test
        run: node bin/claude-router.mjs help

  container:
    name: Docker offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t claude-model-router:test .
      - name: Run tests without network
        run: >-
          docker run --rm --network none --tmpfs /tmp
          --volume "${{ github.workspace }}:/work:ro"
          --workdir /work
          claude-model-router:test
          node --test test/run.mjs
      - name: Compose config validation
        run: CLAUDE_ROUTER_DATA_DIR=/tmp/claude-router CLAUDE_ROUTER_PORT=17861 docker compose config --quiet
